name: Ticket Plus 釋票監控

on:
  schedule:
    - cron: "0 * * * *"      # 每小時整點啟動一次（程式內部持續跑 50 分鐘）
    - cron: "30 * * * *"     # 每小時 30 分再啟動一次，補足排程延遲的空窗
  workflow_dispatch:          # 允許手動觸發

permissions:
  contents: write

concurrency:
  group: ticket-monitor
  cancel-in-progress: false   # 前一輪跑完才換下一輪，避免重疊

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 55       # 保險：最長 55 分鐘強制結束
    steps:
      - name: 取出 repo
        uses: actions/checkout@v4

      - name: 安裝 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 執行監控
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: node monitor.js

      - name: 儲存狀態
        if: always()          # 即使監控步驟逾時也要存狀態
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add monitor-state.json
          git diff --cached --quiet || git commit -m "update state [skip ci]"
          git pull --rebase origin main
          git push
